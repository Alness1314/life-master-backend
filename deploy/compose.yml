name: lifemaster

services:
  files-init:
    image: life-master-backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - chown -R lifemaster:lifemaster /app/data/files
    restart: "no"
    volumes:
      - lifemaster_files_data:/app/data/files

  api:
    image: life-master-backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: lifemaster-api
    restart: unless-stopped
    depends_on:
      files-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        format: raw
    volumes:
      - lifemaster_files_data:/app/data/files
    networks:
      - backend-net
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  lifemaster_files_data:

networks:
  backend-net:
    external: true
