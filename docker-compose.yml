services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifemaster
      POSTGRES_USER: lifemaster
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5432:5432"
    volumes:
      - lifemaster_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemaster"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - lifemaster_files_data:/app/data/files
    environment:
      PORT: 8080
      PREFIX: /api/v1
      DB_URL_NAME: jdbc:postgresql://postgres:5432/lifemaster
      DB_USERNAME: lifemaster
      DB_PASSWORD: local-only-password
      JWT_SECRET: local-development-secret-change-before-production-123456
      DEFAULT_PASS: local-admin-password
      EMAIL_HOST: localhost
      EMAIL_PORT: 2525
      EMAIL_USERNAME: local@example.com
      EMAIL_PASSWORD: local-only
      SERVER_URL: http://localhost:8080
      SERVER_DESCRIPTION: Local Docker
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      SWAGGER_ENABLED: "true"
      REMINDERS_ENABLED: "false"

volumes:
  lifemaster_pg:
  lifemaster_files_data:
