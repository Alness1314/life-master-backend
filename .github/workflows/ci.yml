name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: ./mvnw -B test
      - name: Package
        run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: life-master-backend
          path: target/life-master-*.jar
          if-no-files-found: error
      - name: Validate container build
        run: docker build -t life-master-backend:${{ github.sha }} .

  deploy:
    name: Build and deploy on nidum-server
    needs: test-and-package
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, nidum-server, lifemaster]
    environment: development
    timeout-minutes: 30
    concurrency:
      group: lifemaster-development
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build versioned image
        run: docker build --file Dockerfile --tag "life-master-backend:${GITHUB_SHA}" .

      - name: Prepare deployment configuration
        env:
          DB_URL_NAME: ${{ secrets.DB_URL_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEFAULT_PASS: ${{ secrets.DEFAULT_PASS }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST || 'smtp.gmail.com' }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT || '587' }}
          SERVER_URL: ${{ vars.SERVER_URL || 'https://goniac-mervin-lactationally.ngrok-free.dev' }}
          SERVER_DESCRIPTION: ${{ vars.SERVER_DESCRIPTION || 'LifeMaster development' }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'https://life-master-frontend-v2.vercel.app' }}
          SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED || 'true' }}
          REMINDERS_ENABLED: ${{ vars.REMINDERS_ENABLED || 'false' }}
        run: |
          set -eu
          for variable in DB_URL_NAME DB_USERNAME DB_PASSWORD JWT_SECRET DEFAULT_PASS EMAIL_USERNAME EMAIL_PASSWORD; do
            test -n "$(printenv "$variable")" || { echo "Missing required development secret: $variable"; exit 1; }
          done

          deploy_dir=/home/albert/apps/lifemaster-backend
          install -d -m 700 "$deploy_dir"
          install -m 644 deploy/compose.yml "$deploy_dir/compose.yml"
          umask 077
          {
            printf 'APP_IMAGE_TAG=%s\n' "$GITHUB_SHA"
            printf 'APP_VERSION=%s\n' "0.0.1-${GITHUB_SHA}"
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'PORT=8080\n'
            printf 'PREFIX=/api/v1\n'
            printf 'DB_URL_NAME=%s\n' "$DB_URL_NAME"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'DEFAULT_PASS=%s\n' "$DEFAULT_PASS"
            printf 'EMAIL_HOST=%s\n' "$EMAIL_HOST"
            printf 'EMAIL_PORT=%s\n' "$EMAIL_PORT"
            printf 'EMAIL_USERNAME=%s\n' "$EMAIL_USERNAME"
            printf 'EMAIL_PASSWORD=%s\n' "$EMAIL_PASSWORD"
            printf 'SERVER_URL=%s\n' "$SERVER_URL"
            printf 'SERVER_DESCRIPTION=%s\n' "$SERVER_DESCRIPTION"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
            printf 'SWAGGER_ENABLED=%s\n' "$SWAGGER_ENABLED"
            printf 'REMINDERS_ENABLED=%s\n' "$REMINDERS_ENABLED"
            printf 'RECURRING_SCHEDULER_ENABLED=true\n'
            printf 'FINANCIAL_ALERTS_SCHEDULER_ENABLED=true\n'
            printf 'FILES_ROOT=/app/data/files\n'
            printf 'FILES_MAX_SIZE_BYTES=10485760\n'
            printf 'BANK_IMPORT_MAX_SIZE_BYTES=20971520\n'
            printf 'TZ=America/Mexico_City\n'
            printf 'JAVA_TOOL_OPTIONS=-Duser.timezone=America/Mexico_City\n'
          } > "$deploy_dir/.env"
          chmod 600 "$deploy_dir/.env"

      - name: Preserve rollback image
        run: |
          current_image=$(docker inspect --format '{{.Image}}' lifemaster-api 2>/dev/null || true)
          if [ -n "$current_image" ]; then
            docker image tag "$current_image" life-master-backend:rollback
          fi

      - name: Deploy application
        working-directory: /home/albert/apps/lifemaster-backend
        run: docker compose --env-file .env --file compose.yml up --detach --remove-orphans

      - name: Wait for healthcheck
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' lifemaster-api)
            if [ "$status" = healthy ]; then
              docker exec lifemaster-api curl --fail --silent --show-error \
                http://127.0.0.1:8080/actuator/health/readiness
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs --tail 200 lifemaster-api
              exit 1
            fi
            sleep 5
          done
          docker logs --tail 200 lifemaster-api
          exit 1

      - name: Ensure ngrok tunnel is running
        working-directory: /home/albert/apps/ngrok-kong
        run: docker compose --file compose.yml up --detach
