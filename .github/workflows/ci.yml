name: Backend CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: ./mvnw -B test
      - name: Package
        run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: life-master-backend
          path: target/life-master-*.jar
          if-no-files-found: error
      - name: Validate container build
        run: docker build -t life-master-backend:${{ github.sha }} .
