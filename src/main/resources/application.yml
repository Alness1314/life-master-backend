#server configuration
server:
    port: ${PORT}
    #error:
        #include-stacktrace: never

#spring configuration
spring:
    application:
        name: LifeMaster

    flyway:
        connect-retries: 10
        connect-retries-interval: 5

#image configuration size
    servlet: 
        multipart: 
            max-file-size: 20MB
            max-request-size: 20MB
#datasource
    datasource:
        url: ${DB_URL_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            initialization-fail-timeout: 60000
    jpa: 
        database-platform: org.hibernate.dialect.PostgreSQLDialect 
        show-sql: false
        open-in-view: false
        hibernate: 
            ddl-auto: none # Opciones: create, create-drop, update, validate, none

    mail:
        host: ${EMAIL_HOST:smtp.gmail.com}
        port: ${EMAIL_PORT:587}
        username: ${EMAIL_USERNAME}
        password: ${EMAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: ${SMTP_AUTH:true}
                    starttls:
                        enable: ${SMTP_STARTTLS_ENABLE:true}
                        required: ${SMTP_STARTTLS_REQUIRE:true}
                    ssl:
                        enable: ${SMTP_SSL_ENABLE:false}
                        trust: ${SMTP_SSL_TRUST:smtp.gmail.com}
                    connectiontimeout: ${SMTP_CONNECTIONTIMEOUT:5000}
                    timeout: ${SMTP_TIMEOUT:5000}
                    writetimeout: ${SMTP_WRITETIMEOUT:5000}

#Open api swagger ui 
springdoc: 
    api-docs: 
        enabled: ${SWAGGER_ENABLED:true}
        path: /api-docs
    swagger-ui:
        enabled: ${SWAGGER_ENABLED:true}
        persist-authorization: true
        tags-sorter: alpha
        doc-expansion: list  # none | list | full

#prefix endpoints configuration
api:
    prefix: ${PREFIX} 

#secret jwt
jwt:
    secret: ${JWT_SECRET}

swg:
    server:
        url: ${SERVER_URL}
        description: ${SERVER_DESCRIPTION}


sys:
    user:
        password: ${DEFAULT_PASS}

email:
    from: ${EMAIL_USERNAME}

app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    files:
        root: ${FILES_ROOT:./data/files}
        max-size-bytes: ${FILES_MAX_SIZE_BYTES:10485760}
    recurring-movements:
        scheduler-enabled: ${RECURRING_SCHEDULER_ENABLED:true}
        cron: ${RECURRING_SCHEDULER_CRON:0 5 0 * * *}
        zone: ${RECURRING_SCHEDULER_ZONE:America/Mexico_City}
    financial-alerts:
        scheduler-enabled: ${FINANCIAL_ALERTS_SCHEDULER_ENABLED:true}
        cron: ${FINANCIAL_ALERTS_SCHEDULER_CRON:0 20 0 * * *}
        zone: ${FINANCIAL_ALERTS_SCHEDULER_ZONE:America/Mexico_City}
    sessions:
        cleanup-cron: ${SESSION_CLEANUP_CRON:0 40 0 * * *}
        zone: ${SESSION_SCHEDULER_ZONE:America/Mexico_City}
    reminders:
        enabled: ${REMINDERS_ENABLED:false}
    bank-import:
        max-size-bytes: ${BANK_IMPORT_MAX_SIZE_BYTES:20971520}

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: when_authorized
    info:
        env:
            enabled: true

info:
    app:
        name: LifeMaster
        version: ${APP_VERSION:0.0.1-SNAPSHOT}
